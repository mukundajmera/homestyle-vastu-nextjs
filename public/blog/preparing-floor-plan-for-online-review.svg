<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Prepare a floor plan for review</title><desc id="desc">Annotated architectural plan with a north arrow, dimensions, room names, entrances, windows and fixed features.</desc>
  <rect width="1440" height="900" fill="#FAF7F2"/><text x="95" y="88" fill="#2D2118" font-family="Georgia,serif" font-size="44">A useful plan tells its own story</text><text x="95" y="135" fill="#675346" font-family="Arial,sans-serif" font-size="22">Direction · dimensions · labels · fixed features</text>
  <path d="M205 255H925V705H205zM565 255v190H925M565 445H205M565 445v260M735 445v260" fill="#F5EFEB" stroke="#6E5A4A" stroke-width="10"/><path d="M235 285H535v130H235zM595 285H895v130H595zM235 475H535v200H235zM595 475H705v200H595zM765 475H895v200H765z" fill="#EEE7DC" stroke="#CFC3AF" stroke-width="3"/>
  <text x="325" y="355" fill="#2D2118" font-family="Arial,sans-serif" font-size="24">Living</text><text x="660" y="355" fill="#2D2118" font-family="Arial,sans-serif" font-size="24">Kitchen</text><text x="325" y="575" fill="#2D2118" font-family="Arial,sans-serif" font-size="24">Bedroom</text><text x="606" y="570" fill="#2D2118" font-family="Arial,sans-serif" font-size="18">Bath</text><text x="790" y="570" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">Study</text>
  <path d="M205 225h720M175 255v450" stroke="#C25E3E" stroke-width="3"/><text x="500" y="210" fill="#8D3F2C" font-family="Arial,sans-serif" font-size="20">Outside dimension</text><text x="130" y="500" fill="#8D3F2C" font-family="Arial,sans-serif" font-size="20" transform="rotate(-90 130 500)">Room dimensions</text>
  <path d="M1060 360v-110m0 0-22 35m22-35 22 35" fill="none" stroke="#C25E3E" stroke-width="8"/><text x="1048" y="230" fill="#2D2118" font-family="Arial,sans-serif" font-size="23" font-weight="700">N</text>
  <rect x="1010" y="435" width="295" height="240" rx="10" fill="#DDE7DE" stroke="#4A6B5D" stroke-width="3"/><text x="1040" y="485" fill="#2D2118" font-family="Arial,sans-serif" font-size="23" font-weight="700">Before sharing</text><text x="1040" y="530" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">✓ Label every floor</text><text x="1040" y="570" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">✓ Mark fixed services</text><text x="1040" y="610" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">✓ Write focused questions</text>
  <text x="100" y="810" fill="#675346" font-family="Arial,sans-serif" font-size="20">Label estimates and unknowns; do not draw uncertain measurements as exact.</text>
