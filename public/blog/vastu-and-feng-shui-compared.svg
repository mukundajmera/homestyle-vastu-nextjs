<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Vastu and Feng Shui compared in a home plan</title>
  <desc id="desc">Architectural comparison diagram with a measured home plan, compass and labeled entrance and kitchen.</desc>
  <rect width="1440" height="900" fill="#FAF7F2"/><path d="M70 110H1370M70 790H1370" stroke="#CFC3AF" stroke-width="2"/>
  <text x="100" y="78" fill="#2D2118" font-family="Georgia,serif" font-size="42">Two traditions, one measured home</text>
  <text x="100" y="155" fill="#675346" font-family="Arial,sans-serif" font-size="22">Compare the questions each perspective may raise</text>
  <rect x="100" y="205" width="540" height="510" rx="8" fill="#F5EFEB" stroke="#C25E3E" stroke-width="3"/>
  <rect x="800" y="205" width="540" height="510" rx="8" fill="#F5EFEB" stroke="#4A6B5D" stroke-width="3"/>
  <text x="140" y="265" fill="#8D3F2C" font-family="Arial,sans-serif" font-size="28" font-weight="700">Vastu Shastra</text><text x="840" y="265" fill="#365646" font-family="Arial,sans-serif" font-size="28" font-weight="700">Feng Shui</text>
  <path d="M180 330H550V620H180zM360 330v150h190M360 480H180M450 480v140M180 550h180" fill="none" stroke="#6E5A4A" stroke-width="8"/>
  <rect x="185" y="335" width="170" height="140" fill="#EADBC8"/><rect x="365" y="335" width="180" height="140" fill="#DDE7DE"/><rect x="185" y="485" width="170" height="130" fill="#EEE7DC"/><rect x="455" y="485" width="90" height="130" fill="#EADBC8"/>
  <text x="220" y="410" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">Living</text><text x="420" y="410" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">Kitchen</text><text x="235" y="560" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">Bedroom</text><text x="462" y="550" fill="#2D2118" font-family="Arial,sans-serif" font-size="18">Entry</text>
  <path d="M550 535h35v85h-35" fill="none" stroke="#C25E3E" stroke-width="10"/><circle cx="590" cy="650" r="33" fill="#C25E3E"/><text x="581" y="658" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="700">N</text>
  <path d="M880 330H1250V620H880zM1060 330v150h190M1060 480H880M1150 480v140M880 550h180" fill="none" stroke="#6E5A4A" stroke-width="8"/>
  <rect x="885" y="335" width="170" height="140" fill="#EADBC8"/><rect x="1065" y="335" width="180" height="140" fill="#DDE7DE"/><rect x="885" y="485" width="170" height="130" fill="#EEE7DC"/><rect x="1155" y="485" width="90" height="130" fill="#EADBC8"/>
  <text x="920" y="410" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">Living</text><text x="1120" y="410" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">Kitchen</text><text x="935" y="560" fill="#2D2118" font-family="Arial,sans-serif" font-size="20">Bedroom</text><text x="1162" y="550" fill="#2D2118" font-family="Arial,sans-serif" font-size="18">Entry</text>
  <path d="M1250 535h35v85h-35" fill="none" stroke="#4A6B5D" stroke-width="10"/><circle cx="1290" cy="650" r="33" fill="#4A6B5D"/><text x="1281" y="658" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="700">N</text>
  <text x="100" y="765" fill="#675346" font-family="Arial,sans-serif" font-size="20">Traditional perspectives vary by method. The drawing is a prompt for questions, not a verdict.</text>
</svg>
